[workspace]
authors = ["John <JohnChangSu@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
name = "mojo_lbm"
platforms = ["linux-64"]
version = "0.1.0"

[tool.pixi.system-requirements]
glibc = "2.34"

[dependencies]
python = ">=3.14.7,<3.15"
pip = "*"
mojo = ">=1.0.0,<2"
matplotlib = ">=3.10.9"
numpy  = ">=2.4.5"
pandas = ">=3.0.3"
pyvista= ">=0.48.4"
max = ">=26.5.0,<27"
# Tells Pixi to load dependencies from pyproject.toml
[pypi-dependencies]
mojo_lbm = { path = ".", editable = true }

[tasks]
lbm = "python ./dev_tools/buildLBM.py"
compiletest = "python ./dev_tools/compiletest.py"
capture_precompile = "python ./dev_tools/capture_precompile_stdout.py"
precompile_test = "mojo precompile src -o src.mojoc --disable-warnings"
replace = "source ./dev_tools/replace.sh"

[feature.dev.dependencies]
nodejs = "*" # Node, npm, and npx live here

[environments]
default = []
dev = ["dev"] # Developers activate or target this environment
 